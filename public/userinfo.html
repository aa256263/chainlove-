<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>使用者資料</title>
    <link href="./css/index.css" rel="stylesheet">
    
</head>
<body>
    <h2>使用者資料</h2>
    <form id="userInfoForm">
        <div>
            <label for="username"></label>
            <input type="text" id="username" name="username" disabled>
        </div>
        <div>
            <label for="account">帳號:</label>
            <input type="text" id="account" name="account" disabled>
        </div>
        <div>
            <label for="password">密碼:</label>
            <input type="password" id="password" name="password" disabled>
        </div>
        <label id="total-donations">Total Donations: $</label>
        <div>
            <button type="button" id="enableEditing">編輯資料</button>
            <button type="button" id="updateUserInfo" disabled >更新資料</button>
            <button type="button" id="indexbt">主頁面</button>
        </div>
    </form>
    <div id="bookmarked-projects-container">
        <!-- 这里将动态添加项目卡片 -->
    </div>
    <script src="./js/userinfo.js"></script>
    <script src="./js/headlogo.js"></script>
</body>
</html>
