<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入畫面</title>
    <link href="./css/login_new.css" rel="stylesheet" />
</head>

<body>
    <div class="login-container">
        <a href="./start.html" class="back-button">←</a>
        <h1 class="login-title">歡迎回來！</h1>
        <p class="login-subtitle">登入帳號以開始捐款</p>
        <form>
            <div class="input-group">
                <label for="loginUsername" class="email-label">電子郵件</label>
                <input type="email" id="loginUsername" name="email" placeholder="輸入電子郵件" required>
            </div>
            <div class="input-group">
                <label for="loginPassword" class="password-label">密碼</label>
                <input type="password" id="loginPassword" name="password" placeholder="輸入密碼" required>
            </div>
            <div class="register-link">
                沒有帳號嗎？
                <a href="./register.html">註冊帳號</a>
            </div>
            <button type="button" class="login-button" id="loginbtn">登入</button>
        </form>
    </div>

    <script src="./js/login.js"></script>
    <script src="./js/headlogo.js"></script>
</body>

</html>
