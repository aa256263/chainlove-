<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>里程碑進度</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/show_milestone.css">
</head>
<body>
    <div class="view">
        <header class="header">
            <a href="#" class="back-button" onclick="history.back()">←</a>
            <h1>階段目標</h1>
        </header>

        <div class="milestone-content">
            <div class="milestone-section">
                <h2>募款進度 <span class="status achieved">已達標</span></h2>
                <h3 class="milestone-title">里程碑標題</h3>
                <p class="milestone-expected">里程碑實際執行內容</p>
            </div>

            <div class="milestone-section">
                <h2>執行結果 <span class="status uploaded">已上傳</span></h2>
                <p class="milestone-completed">里程碑實際執行內容</p>
            </div>

            <div class="milestone-section">
                <h2>證明圖片</h2>
                <div class="proof-images">
                    <img src="#" alt="" class="proof-image">
                    <img src="#" alt="" class="proof-image">
                    <img src="#" alt="" class="proof-image">
                </div>
            </div>
        </div>
    </div>
    <script src="js/showmilestone.js"></script>
    <script src="./js/headlogo.js"></script>
</body>
</html>
