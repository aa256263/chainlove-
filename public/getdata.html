<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Project Details</title>
    <link href="./css/audit.css" rel="stylesheet">
    <style>
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f9fa;
            color: #495057;
            font-size: 16px;
            display: block;
        }
        
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            color: #343a40;
        }
        
        div {
            margin-bottom: 15px;
        }
        
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        
    </style>
</head>
<body onload="loadUnapprovedProjects()">
    <div class="navbar">
        <div class="menu-icon" onclick="openNav()">&#9776;</div>
    </div>

    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="./login.html">登出</a>
        <a href="./getdata.html">項目審核</a>
        <a href="./auditmilestone.html">里程碑審核</a>
        <a href="./auditnews.html">新聞審核</a>
        <a href="./auditupcost.html">金流審核</a>
    </div>

    <div class="container">
        <h1>項目審核</h1>
        <label for="projectId">選擇未審核項目</label>
        <select id="projectId" name="projectId">
            <!-- 選項將在這裡動態加載 -->
        </select>
        <button onclick="fetchProject()">確認</button>
        
        <div id="projectContainer"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.0/dist/web3.min.js"></script>
    <script src="./js/getdata.js"></script>
    <script>
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }
    </script>
    <script src="./js/headlogo.js"></script>
</body>
</html>
